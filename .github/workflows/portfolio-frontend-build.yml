name: Frontend build verification
on:
  push:
    branches: [docs/portfolio-professionalization-2026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: statisticsWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: statisticsWeb/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
